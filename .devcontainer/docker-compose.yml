name: desafio-projeto-etl-python=ia-generativa
version: "3.8"

services:
  app:
    container_name: pipeline-etl-python
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
    ports:
      - "8082:8082"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: bash -c "luigid --port 8082 & sleep infinity"
    networks:
      - rede_pipeline_etl_python

networks:
  rede_pipeline_etl_python:
    external: true